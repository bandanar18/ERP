# Companies Feature

paths:
  /api/companies:
    get:
      tags: [Empresas]
      summary: Listar empresas
      description: Obtiene todas las empresas. Requiere autenticación.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de empresas
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    taxId:
                      type: string
                    legalName:
                      type: string
                    address:
                      type: string
                    phone:
                      type: string
                    email:
                      type: string
                    logoUrl:
                      type: string
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
                    _count:
                      type: object
                      properties:
                        users:
                          type: integer
                        projects:
                          type: integer
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string

    post:
      tags: [Empresas]
      summary: Crear empresa
      description: Crea una nueva empresa. Solo accesible para administradores y gestión.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Nombre de la empresa
                taxId:
                  type: string
                  description: RUC/RIF de la empresa
                legalName:
                  type: string
                  description: Razón social
                address:
                  type: string
                  description: Dirección
                phone:
                  type: string
                  description: Teléfono
                email:
                  type: string
                  format: email
                  description: Email de contacto
                logoUrl:
                  type: string
                  description: URL del logo de la empresa
      responses:
        '201':
          description: Empresa creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  taxId:
                    type: string
                  legalName:
                    type: string
                  address:
                    type: string
                  phone:
                    type: string
                  email:
                    type: string
                  logoUrl:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  _count:
                    type: object
                    properties:
                      users:
                        type: integer
                      projects:
                        type: integer
        '400':
          description: Error de validación
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
        '409':
          description: Empresa duplicada
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string

  /api/companies/{id}:
    get:
      tags: [Empresas]
      summary: Obtener empresa por ID
      description: Obtiene una empresa específica. Requiere autenticación.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID de la empresa
      responses:
        '200':
          description: Empresa encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  taxId:
                    type: string
                  legalName:
                    type: string
                  address:
                    type: string
                  phone:
                    type: string
                  email:
                    type: string
                  logoUrl:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  _count:
                    type: object
                    properties:
                      users:
                        type: integer
                      projects:
                        type: integer
        '404':
          description: Empresa no encontrada
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string

    put:
      tags: [Empresas]
      summary: Actualizar empresa
      description: Actualiza una empresa existente. Solo accesible para administradores y gestión.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID de la empresa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                taxId:
                  type: string
                legalName:
                  type: string
                address:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                  format: email
                logoUrl:
                  type: string
      responses:
        '200':
          description: Empresa actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  taxId:
                    type: string
                  legalName:
                    type: string
                  address:
                    type: string
                  phone:
                    type: string
                  email:
                    type: string
                  logoUrl:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  _count:
                    type: object
                    properties:
                      users:
                        type: integer
                      projects:
                        type: integer
        '400':
          description: Error de validación
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
        '404':
          description: Empresa no encontrada
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
        '409':
          description: Empresa duplicada
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string

    delete:
      tags: [Empresas]
      summary: Eliminar empresa
      description: Elimina una empresa existente. Solo accesible para administradores y gestión.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID de la empresa
      responses:
        '200':
          description: Empresa eliminada
          content:
            application/json:
              example:
                message: Empresa eliminada correctamente
        '400':
          description: No se puede eliminar (tiene usuarios asociados)
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
        '404':
          description: Empresa no encontrada
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
