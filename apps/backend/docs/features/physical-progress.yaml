# Physical Progress API (Avances Físicos)

tags:
  - name: Avances Físicos
    description: Seguimiento de avance físico de proyectos con control por roles

paths:
  /api/physical-progress:
    get:
      tags: [Avances Físicos]
      summary: Listar avances por empresa (comportamiento por rol)
      description: |
        Retorna los avances físicos de proyectos agrupados por empresa.

        **Comportamiento por rol:**

        - **planificador**: Solo sus proyectos asignados
        - **gestion/administrador**: TODOS los proyectos del sistema

        Cada empresa incluye managers y proyectos con último avance.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Avances agrupados por empresa
          content:
            application/json:
              schema:
                type: object
                properties:
                  companies:
                    type: array
                    items:
                      type: object
                      properties:
                        companyId:
                          type: string
                        companyName:
                          type: string
                        managers:
                          type: array
                          items:
                            type: object
                            properties:
                              managerId:
                                type: string
                              managerName:
                                type: string
                              managerEmail:
                                type: string
                        projects:
                          type: array
                          items:
                            type: object
                            properties:
                              projectId:
                                type: string
                              projectCode:
                                type: string
                              projectName:
                                type: string
                              shortName:
                                type: string
                                nullable: true
                              status:
                                type: string
                              manager:
                                type: object
                                nullable: true
                                properties:
                                  managerId:
                                    type: string
                                  managerName:
                                    type: string
                                  managerEmail:
                                    type: string
                              lastProgress:
                                type: object
                                nullable: true
                                properties:
                                  id:
                                    type: string
                                  date:
                                    type: string
                                    format: date-time
                                  actualProgress:
                                    type: string
                                    nullable: true
                                  plannedProgress:
                                    type: string
                                    nullable: true
                                  attentionPoints:
                                    type: string
                                    nullable: true
              examples:
                planificador:
                  value:
                    companies:
                      - companyId: "comp-1"
                        companyName: "Constructora S.A."
                        managers:
                          - managerId: "user-1"
                            managerName: "Juan Pérez"
                            managerEmail: "juan@example.com"
                        projects:
                          - projectId: "proj-1"
                            projectCode: "PROJ-001"
                            projectName: "Construcción Edificio A"
                            status: "ACTIVE"
                            manager:
                              managerId: "user-1"
                              managerName: "Juan Pérez"
                              managerEmail: "juan@example.com"
                            lastProgress:
                              id: "prog-1"
                              date: "2026-05-27T10:00:00Z"
                              actualProgress: "75%"
                              plannedProgress: "70%"
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
        '403':
          description: Sin permisos
          content:
            application/json:
              schema:
                type: object
                required: [error, code]
                properties:
                  error:
                    type: string
                  code:
                    type: string

  /api/physical-progress/company/{companyId}:
    get:
      tags: [Avances Físicos]
      summary: Últimos avances de una empresa
      description: |
        Retorna los últimos avances físicos de todos los proyectos de una empresa.

        **planificador**: Solo sus proyectos
        **gestion/administrador**: Todos los proyectos
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
          description: ID de la empresa
      responses:
        '200':
          description: Últimos avances de la empresa
          content:
            application/json:
              schema:
                type: object
                properties:
                  companyId:
                    type: string
                  companyName:
                    type: string
                  managers:
                    type: array
                    items:
                      type: object
                      properties:
                        managerId:
                          type: string
                        managerName:
                          type: string
                        managerEmail:
                          type: string
                  latestProgress:
                    type: array
                    items:
                      type: object
                      properties:
                        projectId:
                          type: string
                        projectCode:
                          type: string
                        projectName:
                          type: string
                        manager:
                          type: object
                          nullable: true
                          properties:
                            managerId:
                              type: string
                            managerName:
                              type: string
                            managerEmail:
                              type: string
                        progress:
                          type: object
                          properties:
                            id:
                              type: string
                            date:
                              type: string
                              format: date-time
                            actualProgress:
                              type: string
                              nullable: true
                            plannedProgress:
                              type: string
                              nullable: true
                            attentionPoints:
                              type: string
                              nullable: true
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
        '403':
          description: Sin permisos
          content:
            application/json:
              schema:
                type: object
                required: [error, code]
                properties:
                  error:
                    type: string
                  code:
                    type: string
        '404':
          description: Empresa no encontrada
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string

  /api/physical-progress/project/{projectId}:
    get:
      tags: [Avances Físicos]
      summary: Todos los avances de un proyecto
      description: |
        Retorna el historial completo de avances físicos de un proyecto.

        **planificador**: Solo si es el manager
        **gestion/administrador**: Cualquier proyecto
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
          description: ID del proyecto
      responses:
        '200':
          description: Historial de avances
          content:
            application/json:
              schema:
                type: object
                properties:
                  projectId:
                    type: string
                  projectCode:
                    type: string
                  projectName:
                    type: string
                  manager:
                    type: object
                    nullable: true
                    properties:
                      managerId:
                        type: string
                      managerName:
                        type: string
                      managerEmail:
                        type: string
                  progress:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        date:
                          type: string
                          format: date-time
                        actualProgress:
                          type: string
                          nullable: true
                        plannedProgress:
                          type: string
                          nullable: true
                        attentionPoints:
                          type: string
                          nullable: true
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
        '403':
          description: Sin permisos
          content:
            application/json:
              schema:
                type: object
                required: [error, code]
                properties:
                  error:
                    type: string
                  code:
                    type: string
        '404':
          description: Proyecto no encontrado
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
